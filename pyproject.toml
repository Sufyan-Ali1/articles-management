[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "blog-backend"
version = "1.0.0"
description = "Async PostgreSQL blog API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1", "alembic>=1.14,<2", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "PyJWT>=2.10,<3", "argon2-cffi>=23.1,<26",
  "nh3>=0.2.20,<1", "httpx>=0.28,<1", "email-validator>=2.2,<3",
  "anyio>=4.8,<5", "certifi>=2026.10.19,<2027",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<3"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "E501", "UP046", "UP047"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["nh3.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires a migrated disposable PostgreSQL database"]
