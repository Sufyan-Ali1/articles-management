name: backend
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_runner
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: blog_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test_runner -d blog_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://test_runner:ci-disposable-only@127.0.0.1:5432/blog_test
      TEST_DATABASE_URL: postgresql+asyncpg://test_runner:ci-disposable-only@127.0.0.1:5432/blog_test
      JWT_SECRET: ci-only-signing-secret-never-use-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest
      - run: alembic downgrade base && alembic upgrade head && alembic check
      - run: docker build --pull --target production -t blog-backend:ci .
